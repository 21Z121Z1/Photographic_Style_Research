name: hdr-native-s61
on:
  push:
    branches: ['research/vm-native-20261020-hdr-s61']
  workflow_dispatch:
jobs:
  stats-host-failure-trace:
    runs-on: xcode-27
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      OPENBLAS_NUM_THREADS: '1'
      VM_DISABLE_RESIDENCY_SETS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare private working data
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/hdr-s61"; mkdir -m 700 "$W"
          mkdir "$W/out" "$W/private" "$W/gnupg"
          chmod 700 "$W/private" "$W/gnupg"
          echo "W=$W" >> "$GITHUB_ENV"
          echo "GNUPGHOME=$W/gnupg" >> "$GITHUB_ENV"
          test "$(sw_vers -buildVersion)" = 26A434
          sw_vers > "$W/out/host.txt"
          command -v gpg >/dev/null || brew install gnupg
          gpg --homedir "$W/gnupg" --batch --import research/semantic-styles/archive-public.asc > "$W/out/key-import.log" 2>&1
          python3 -m pip install --quiet --only-binary=:all: 'numpy==2.3.4' > "$W/out/dependencies.log" 2>&1
      - name: Original process on five full-size sources
        run: |
          set -euo pipefail
          ulimit -c 0
          python3 research/hdr-native/run_hdr_s61.py > "$W/out/driver.log" 2>&1
      - name: Seal text and encrypted capture inventory
        if: always()
        run: |
          python3 - <<'PY'
          import os,pathlib,json,hashlib,subprocess
          root=pathlib.Path(os.environ['W'])/'out';rows=[]
          for p in sorted(root.iterdir()):
              if p.is_file() and p.name!='manifest.json':
                  assert p.suffix in {'.json','.log','.txt','.gpg'}
                  with p.open('rb')as f:h=hashlib.file_digest(f,'sha256').hexdigest()
                  rows.append({'path':p.name,'size':p.stat().st_size,'sha256':h})
          assert sum(x['size']for x in rows)<150000
          (root/'manifest.json').write_text(json.dumps({'run_id':os.environ['GITHUB_RUN_ID'],'commit':os.environ['GITHUB_SHA'],'os_build':subprocess.check_output(['sw_vers','-buildVersion'],text=True).strip(),'image_version':os.environ.get('ImageVersion'),'raw_spatial_outputs_encrypted':True,'private_archive_key_uploaded':False,'files':rows},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hdr-s61-stats-host-evidence
          path: ${{ env.W }}/out/
          retention-days: 1
      - name: Clean only own runner working data
        if: always()
        run: test -n "${W:-}" && rm -rf -- "$W"
