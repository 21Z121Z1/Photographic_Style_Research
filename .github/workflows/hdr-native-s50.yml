name: hdr-native-s50
on:
  push:
    branches: ['research/vm-native-20261019-hdr-s50']
  workflow_dispatch:
jobs:
  finite-offset-collision:
    runs-on: xcode-27
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare only synthetic scalar input
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/hdr-s50"; mkdir -m 700 "$W"
          mkdir "$W/out"
          echo "W=$W" >> "$GITHUB_ENV"
          test "$(sw_vers -buildVersion)" = 26A434
          sw_vers > "$W/out/host.txt"
          python3 -m pip install --quiet 'numpy==2.3.4' > "$W/out/dependencies.log" 2>&1
      - name: Certify stored-input collision and compare native headrooms
        run: |
          set -euo pipefail
          ulimit -c 0
          python3 research/hdr-native/run_hdr_s50.py > "$W/out/driver.log" 2>&1
      - name: Seal aggregate text only
        if: always()
        run: |
          python3 - <<'PY'
          import os,pathlib,json,hashlib,subprocess
          root=pathlib.Path(os.environ['W'])/'out';rows=[]
          for p in sorted(root.rglob('*')):
              if p.is_file() and p.name!='manifest.json':
                  assert p.suffix in {'.json','.log','.txt'}
                  with p.open('rb') as f:d=hashlib.file_digest(f,'sha256').hexdigest()
                  rows.append({'path':str(p.relative_to(root)),'size':p.stat().st_size,'sha256':d})
          assert sum(x['size'] for x in rows)<2000000
          (root/'manifest.json').write_text(json.dumps({'run_id':os.environ['GITHUB_RUN_ID'],'commit':os.environ['GITHUB_SHA'],'os_build':subprocess.check_output(['sw_vers','-buildVersion'],text=True).strip(),'image_version':os.environ.get('ImageVersion'),'synthetic_only':True,'photos_used':False,'public_output_scope':'Aggregate text only; synthetic scalar inputs and hashes, no photo or binary','whole_Apple_binary_uploaded':False,'files':rows},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hdr-s50-finite-collision-evidence
          path: ${{ env.W }}/out/
          retention-days: 1
      - name: Remove only own synthetic temporary files
        if: always()
        run: test -n "${W:-}" && rm -rf -- "$W"
