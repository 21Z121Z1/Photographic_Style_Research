name: tone-private-s27
on:
  push:
    branches: ['research/vm-native-20261019-private-s27']
  workflow_dispatch:
jobs:
  local-tone:
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      HOMEBREW_NO_AUTO_UPDATE: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare encrypted curve and local-tone experiment
        run: |
          set -euo pipefail
          command -v gpg >/dev/null || brew install gnupg
          W="$RUNNER_TEMP/tone-s27"; mkdir -m 700 "$W"
          echo "W=$W" >> "$GITHUB_ENV"
          mkdir -m 700 "$W/gnupg"
          python3 -m pip install --quiet numpy pillow pillow-heif opencolorio matplotlib > "$W/dependencies.log" 2>&1
      - name: Decrypt authorized input only in temporary runner storage
        env:
          S27_INPUT_KEY: ${{ secrets.SEMANTIC_S27_INPUT_KEY }}
        run: |
          set -euo pipefail
          export GNUPGHOME="$W/gnupg"
          gh api repos/21Z121Z1/Photographic_Style_Research/releases/assets/655773465 -H 'Accept: application/octet-stream' > "$W/input.gpg"
          python3 - <<'PY'
          import os,pathlib,hashlib,subprocess
          w=pathlib.Path(os.environ['W']);cipher=w/'input.gpg'
          with cipher.open('rb') as f:assert hashlib.file_digest(f,'sha256').hexdigest()=='940ec9baced092b254b9b658144234b3750156105c0f2e46a14ca41ba859c14a'
          key=w/'input-key';key.write_text(os.environ['S27_INPUT_KEY']);key.chmod(0o600)
          with (w/'decrypt.log').open('w') as log:
              subprocess.run(['gpg','--batch','--pinentry-mode','loopback','--passphrase-file',str(key),'--output',str(w/'IMG_2810.HEIC'),'--decrypt',str(cipher)],stdout=log,stderr=subprocess.STDOUT,check=True)
          key.unlink()
          PY
      - name: Native original PSO local-mix retargeting and conditional curve diagram
        env:
          S5_ARCHIVE_SESSION: ${{ secrets.SEMANTIC_S27_S5_SESSION }}
        run: |
          set -euo pipefail
          export GNUPGHOME="$W/gnupg"
          mkdir -p "$W/out"
          python3 research/semantic-styles/run_tone_s27.py > "$W/driver.log" 2>&1
      - name: Encrypt authorized private results
        if: always()
        run: |
          set -euo pipefail
          test -n "${W:-}"
          export GNUPGHOME="$W/gnupg"
          mkdir -p encrypted "$W/out"
          cp "$W/decrypt.log" "$W/dependencies.log" "$W/driver.log" "$W/out/" 2>/dev/null || true
          python3 - <<'PY'
          import hashlib,json,os,pathlib,platform,subprocess
          root=pathlib.Path(os.environ['W'])/'out';rows=[]
          allowed={'.json','.log','.txt','.f16','.f32','.bin','.npz','.png'}
          for p in sorted(root.rglob('*')):
              if p.is_file() and p.name!='manifest.json':
                  assert p.suffix in allowed, 'Unexpected output format'
                  with p.open('rb') as f:h=hashlib.file_digest(f,'sha256').hexdigest()
                  rows.append({'path':str(p.relative_to(root)),'size':p.stat().st_size,'sha256':h})
          assert sum(r['size'] for r in rows)<60_000_000,'Result budget exceeded'
          meta={'run_id':os.environ['GITHUB_RUN_ID'],'commit':os.environ['GITHUB_SHA'],'os_build':subprocess.check_output(['sw_vers','-buildVersion'],text=True).strip(),'runner_image':os.environ.get('ImageOS'),'runner_image_version':os.environ.get('ImageVersion'),'python':platform.python_version(),'files':rows,'people_results_encrypted':True,'whole_Apple_binary_uploaded':False}
          (root/'manifest.json').write_text(json.dumps(meta,indent=2)+'\n')
          PY
          gpg --batch --import research/semantic-styles/archive-public.asc > "$W/key-import.log" 2>&1
          tar -C "$W" -czf - out | gpg --batch --trust-model always --recipient 28E62F64A29764C2F2AEBF5D5B6B1C101E5F5ABA --encrypt --output encrypted/tone-s27.tar.gz.gpg
          shasum -a 256 encrypted/tone-s27.tar.gz.gpg > encrypted/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tone-s27-encrypted
          path: encrypted/
          retention-days: 1
      - name: Remove own runner plaintext
        if: always()
        run: |
          test -n "${W:-}" && rm -rf -- "$W"
