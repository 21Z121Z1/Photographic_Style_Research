name: probe-macos-runtime

# 最小可行性实验 v2 — 修复 timeout(macOS 无此命令)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe-macos-runtime.yml'

jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: 1. 环境信息
        run: |
          echo "=== macOS ==="; sw_vers
          echo "=== arch ==="; uname -m
          echo "=== SIP ==="; csrutil status || true
          echo "=== GUI session ==="; launchctl print gui/$(id -u) 2>&1 | head -4 || echo "NO GUI"
          echo "=== who ==="; whoami; id -u
          echo "=== Metal devices ==="
          system_profiler SPDisplaysDataType 2>/dev/null | grep -iE "Chipset|Metal|VRAM" | head -8 || echo "no display info"

      - name: 2. CMImaging 全貌
        run: |
          set +e
          CMI=/System/Library/PrivateFrameworks/CMImaging.framework
          echo "=== framework 树 ==="
          ls -la "$CMI/" || true
          echo "=== Versions ==="
          ls -la "$CMI/Versions/" || true
          echo "=== 真实二进制路径 ==="
          REAL=$(readlink -f "$CMI/CMImaging" 2>/dev/null || echo "$CMI/Versions/Current/CMImaging")
          echo "REAL=$REAL"
          ls -la "$REAL" || true
          stat -f "size=%z" "$REAL" 2>/dev/null || true
          file "$REAL" 2>/dev/null || true
          echo "=== framework 内所有 metallib ==="
          find "$CMI/" -name '*.metallib' 2>/dev/null | head || true
          echo "=== Resources 目录 ==="
          ls -la "$CMI/Versions/Current/Resources/" 2>/dev/null | head -20 || true

      - name: 3. 静态 UUID 符号 ivar偏移
        run: |
          set +e
          CMI=/System/Library/PrivateFrameworks/CMImaging.framework/CMImaging
          echo "=== UUID / size ==="
          dwarfdump --uuid "$CMI" 2>&1 | head -2
          stat -L -f%z "$CMI"
          echo "=== accessor 符号 ==="
          nm -arch arm64e -m "$CMI" 2>/dev/null | grep -iE "CMIStyleEngineConfiguration (inputIsLinear|skipWeightPlaneSpatialNormalization|applyGDCTo)" | head -10 || echo "(nm 无输出)"
          echo "=== 用 otool 抓 ivar 偏移 ==="
          otool -arch arm64e -ov "$CMI" 2>/dev/null | grep -B1 -A6 -iE "_inputIsLinear|_skipWeightPlaneSpatialNormalization" | head -40 || echo "(otool 失败)"

      - name: 4. dlopen + 实际构造 configuration（关键）
        run: |
          set +e
          cat > /tmp/probe.m <<'EOF'
          #import <Foundation/Foundation.h>
          #import <objc/runtime.h>
          #import <dlfcn.h>
          int main(void) {
            void *h = dlopen("/System/Library/PrivateFrameworks/CMImaging.framework/CMImaging", RTLD_NOW|RTLD_LOCAL);
            if (!h) { printf("DLOPEN_FAIL %s\n", dlerror()); return 1; }
            printf("DLOPEN_OK\n");
            Class cfg = NSClassFromString(@"CMIStyleEngineConfiguration");
            printf("CONFIG_CLASS %s\n", cfg ? "FOUND" : "MISSING");
            Class cs = NSClassFromString(@"CMIStyleEngineCommonSettings");
            printf("COMMONSETTINGS %s\n", cs ? "FOUND" : "MISSING");
            if (cs) {
              SEL sel = NSSelectorFromString(@"configurationForUseCase:");
              printf("HAS_FACTORY %s\n", [cs respondsToSelector:sel] ? "YES":"NO");
              if ([cs respondsToSelector:sel]) {
                for (long uc=0; uc<=9; uc++) {
                  id c = ((id(*)(id,SEL,long))objc_msgSend)(cs, sel, uc);
                  if (!c) { printf("usecase %ld -> nil\n", uc); continue; }
                  unsigned char *p=(unsigned char*)c;
                  BOOL il = NO, sn = NO, g1=NO, g2=NO;
                  SEL s;
                  s=NSSelectorFromString(@"inputIsLinear"); if([c respondsToSelector:s]) il=((BOOL(*)(id,SEL))objc_msgSend)(c,s);
                  s=NSSelectorFromString(@"skipWeightPlaneSpatialNormalization"); if([c respondsToSelector:s]) sn=((BOOL(*)(id,SEL))objc_msgSend)(c,s);
                  s=NSSelectorFromString(@"applyGDCToCoefficientsDuringIntegration"); if([c respondsToSelector:s]) g1=((BOOL(*)(id,SEL))objc_msgSend)(c,s);
                  s=NSSelectorFromString(@"applyGDCToWeightPlanesDuringIntegration"); if([c respondsToSelector:s]) g2=((BOOL(*)(id,SEL))objc_msgSend)(c,s);
                  printf("usecase %ld: inputIsLinear=%d skipSpatialNorm=%d gdcCoef=%d gdcWP=%d\n", uc, il, sn, g1, g2);
                }
              }
            }
            return 0;
          }
          EOF
          clang -fobjc-arc -framework Foundation -Wl,-undefined,dynamic_lookup -o /tmp/probe /tmp/probe.m && /tmp/probe; echo "exit=$?"

      - name: 5. Photos.app 启动（用 perl 替代 timeout）
        run: |
          set +e
          echo "=== Photos 存在? ==="; ls -d /System/Applications/Photos.app
          echo "=== open ==="; open -a Photos 2>&1; echo "open exit=$?"
          sleep 8
          echo "=== 进程 ==="; pgrep -lf Photos | head -5 || echo "NO PROCESS"
          echo "=== osascript ==="; osascript -e 'tell application "Photos" to get name' 2>&1 | head -3 || echo "osascript failed"
          echo "=== 窗口/UI 状态 ==="
          osascript -e 'tell application "System Events" to tell process "Photos" to get name of windows' 2>&1 | head -3 || echo "no UI"

      - name: 6. LLDB 附加自身进程
        run: |
          set +e
          cat > /tmp/spin.c <<'EOF'
          #include <unistd.h>
          int main(void){ for(;;) sleep(1); return 0; }
          EOF
          cc -o /tmp/spin /tmp/spin.c
          /tmp/spin & SPIN=$!
          sleep 1
          echo "=== lldb attach ==="
          lldb -p $SPIN --batch -o "thread backtrace -c 3" -o "detach" 2>&1 | head -15
          kill $SPIN 2>/dev/null || true

      - name: 7. LLDB 附加 Photos（真正的目标）
        run: |
          set +e
          PID=$(pgrep -f "Photos.app/Contents/MacOS/Photos" | head -1)
          echo "Photos PID=${PID:-none}"
          if [ -n "$PID" ]; then
            lldb -p "$PID" --batch -o "image lookup -n '-[CMIStyleEngineConfiguration inputIsLinear]'" -o "detach" 2>&1 | head -25
          else
            echo "SKIP: Photos 未运行"
          fi
