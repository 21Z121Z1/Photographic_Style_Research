name: hdr-native-s88
on:
  push:
    branches: ['research/vm-native-20261020-hdr-s88']
  workflow_dispatch:
jobs:
  independent-HDR-carrier:
    runs-on: xcode-27
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    env:
      OPENBLAS_NUM_THREADS: '1'
      VM_DISABLE_RESIDENCY_SETS: '1'
      S41_HEAP_BYTES: '2147483648'
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare private workspace
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/hdr-s88"
          mkdir -m 700 "$W"
          mkdir "$W/out" "$W/private" "$W/encrypted" "$W/secure"
          mkdir -m 700 "$W/gnupg"
          echo "W=$W" >> "$GITHUB_ENV"
          echo "GNUPGHOME=$W/gnupg" >> "$GITHUB_ENV"
          export GNUPGHOME="$W/gnupg"
          test "$(sw_vers -buildVersion)" = 26A434
          sw_vers > "$W/out/host.txt"
          command -v gpg >/dev/null || brew install gnupg
          gpg --batch --import research/semantic-styles/archive-public.asc > "$W/out/key-import.log" 2>&1
          python3 -m pip install --quiet 'numpy==2.3.4' 'pillow-heif==1.3.0' 'opencolorio==2.6.0' OpenEXR pillow > "$W/out/dependencies.log" 2>&1
      - name: Reconstruct expired input and encode independent HDR target
        run: |
          set -euo pipefail
          ulimit -c 0
          trap '
          cp "$W/case/source-exception.json" "$W/out/source-exception.json" 2>/dev/null || true
          cp "$W/case/native/native.json" "$W/out/native-checkpoint.json" 2>/dev/null || true
          ' EXIT
          python3 research/hdr-native/run_hdr_s88.py > "$W/out/driver.log" 2>&1
      - name: Seal text inventory before capacity check
        if: always()
        run: |
          python3 - <<'PY'
          import os,pathlib,json,hashlib,subprocess
          p=pathlib.Path(os.environ['W'])/'out';rows=[]
          for f in sorted(p.iterdir()):
              if f.is_file() and f.name!='manifest.json':
                  assert f.suffix in {'.json','.log','.txt'}
                  rows.append({'path':f.name,'size':f.stat().st_size,'sha256':hashlib.sha256(f.read_bytes()).hexdigest()})
          (p/'manifest.json').write_text(json.dumps({'run_id':os.environ['GITHUB_RUN_ID'],'commit':os.environ['GITHUB_SHA'],'os_build':subprocess.check_output(['sw_vers','-buildVersion'],text=True).strip(),'image_version':os.environ.get('ImageVersion'),'public_scope':'Aggregate text only; photographs and pixel witnesses encrypted','files':rows},indent=2)+'\n')
          assert sum(x['size'] for x in rows)<250000
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hdr-s88-aggregate
          path: ${{ env.W }}/out/
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hdr-s88-encrypted-outputs
          path: ${{ env.W }}/encrypted/*.gpg
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 1
      - name: Remove only own transient copies
        if: always()
        run: |
          test -n "${W:-}"
          gpgconf --homedir "$W/gnupg" --kill gpg-agent || true
          rm -rf -- "$W"
