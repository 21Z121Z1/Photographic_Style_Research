name: XDRemux isolated offline acceptance
on:
  push:
    branches: [research/xdremux-texture-native-20261019]
    paths: [.github/workflows/xdremux-texture-native.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xdremux-texture-offline-${{ github.ref }}
  cancel-in-progress: false
jobs:
  offline-validation:
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      XDREMUX_SOURCE_SHA: 18340989590d451f5676924feb03c70baa503e1a
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: research/xdremux-texture-native
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: 21Z121Z1/XDRemux
          ref: ${{ env.XDREMUX_SOURCE_SHA }}
          fetch-depth: 8
          path: xdremux
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/fixtures/
            !/docs/assets/
            !/research/
            /research/texture-style/
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy
      - name: Record exact checkout and toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          test "$(git -C xdremux rev-parse HEAD)" = "$XDREMUX_SOURCE_SHA"
          sw_vers | tee evidence/os.txt
          xcodebuild -version | tee evidence/xcode.txt
          xcrun --sdk macosx --show-sdk-version | tee evidence/sdk.txt
          git -C xdremux rev-parse HEAD | tee evidence/xdremux-head.txt
          if ! brew list --versions libheif >/dev/null 2>&1; then brew install libheif; fi
          pkg-config --modversion libheif | tee evidence/libheif.txt
      - name: Run and verify exact-HEAD limited completion gate
        shell: bash
        run: |
          set -euo pipefail
          export PKG_CONFIG_PATH="$(brew --prefix libheif)/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          cd xdremux
          python3 scripts/agent_completion_gate.py run \
            --base f8fcf2067c506e87665e9ea113324db1a57d4cf7 \
            --plan research/texture-style/offline-verification-plan.json
          python3 scripts/agent_completion_gate.py verify \
            ".codex/verification-receipts/$XDREMUX_SOURCE_SHA.json"
      - name: Bind actual receipt or failure to exact source
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shutil
          p=pathlib.Path('evidence');p.mkdir(exist_ok=True)
          source=pathlib.Path('xdremux/.codex/verification-receipts')/(os.environ['XDREMUX_SOURCE_SHA']+'.json')
          if source.is_file():
              shutil.copyfile(source,p/'receipt.json')
              print('TEXTURE_JSON_BEGIN receipt.json')
              print(source.read_text(),end='')
              print('TEXTURE_JSON_END receipt.json')
          rows=[{'path':f.name,'size':f.stat().st_size,'sha256':hashlib.sha256(f.read_bytes()).hexdigest()} for f in sorted(p.iterdir()) if f.is_file()]
          manifest={'head_sha':os.environ['GITHUB_SHA'],'xdremux_head_sha':os.environ['XDREMUX_SOURCE_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'scope':'offline transport and text integrity only; no Texture feature or Photos activation claim','files':rows}
          (p/'manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          print('TEXTURE_JSON_BEGIN manifest.json');print(json.dumps(manifest,indent=2));print('TEXTURE_JSON_END manifest.json')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xdremux-texture-exact-head-offline-receipt
          path: evidence/
          retention-days: 1
