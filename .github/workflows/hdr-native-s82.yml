name: hdr-native-s82
on:
  push:
    branches: ['research/vm-native-20261020-hdr-s82']
  workflow_dispatch:
jobs:
  practical-semantic-strength:
    runs-on: xcode-27
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      OPENBLAS_NUM_THREADS: '1'
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare private sequential workspace
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/hdr-s82"
          mkdir -m 700 "$W"
          mkdir "$W/out" "$W/private" "$W/encrypted"
          mkdir -m 700 "$W/gnupg"
          echo "W=$W" >> "$GITHUB_ENV"
          echo "GNUPGHOME=$W/gnupg" >> "$GITHUB_ENV"
          export GNUPGHOME="$W/gnupg"
          test "$(sw_vers -buildVersion)" = 26A434
          sw_vers > "$W/out/host.txt"
          command -v gpg >/dev/null || brew install gnupg
          gpg --batch --import research/semantic-styles/archive-public.asc > "$W/out/public-key-import.log" 2>&1
          python3 -m pip install --quiet 'numpy==2.3.4' 'opencolorio==2.6.0' pillow > "$W/out/dependencies.log" 2>&1
      - name: Reuse native observations for practical effect controls
        env:
          GH_TOKEN: ${{ github.token }}
          HDR_S82_S5_SESSION: ${{ secrets.HDR_S82_S5_SESSION }}
          HDR_S82_S8_SESSION: ${{ secrets.HDR_S82_S8_SESSION }}
        run: |
          set -euo pipefail
          ulimit -c 0
          python3 research/hdr-native/run_hdr_s82.py > "$W/out/driver.log" 2>&1
      - name: Seal aggregate evidence only
        if: always()
        run: |
          python3 - <<'PY'
          import pathlib,os,json,hashlib,subprocess
          root=pathlib.Path(os.environ['W'])/'out';rows=[]
          for p in sorted(root.iterdir()):
              if p.is_file() and p.name!='manifest.json':
                  assert p.suffix in {'.json','.log','.txt'}
                  with p.open('rb') as f:h=hashlib.file_digest(f,'sha256').hexdigest()
                  rows.append({'path':p.name,'size':p.stat().st_size,'sha256':h})
          assert sum(x['size'] for x in rows)<250000
          (root/'manifest.json').write_text(json.dumps({'run_id':os.environ['GITHUB_RUN_ID'],'commit':os.environ['GITHUB_SHA'],'os_build':subprocess.check_output(['sw_vers','-buildVersion'],text=True).strip(),'image_version':os.environ.get('ImageVersion'),'public_scope':'Aggregate text only; all photo previews/masks encrypted','new_native_pixel_execution':False,'files':rows},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hdr-s82-aggregate
          path: ${{ env.W }}/out/
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: hdr-s82-private-contacts
          path: ${{ env.W }}/encrypted/previews.tar.gz.gpg
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Remove only this run's transient copies
        if: always()
        run: |
          test -n "${W:-}"
          gpgconf --homedir "$W/gnupg" --kill gpg-agent || true
          rm -rf -- "$W"
