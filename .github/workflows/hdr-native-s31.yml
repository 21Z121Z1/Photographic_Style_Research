name: hdr-native-s31
on:
  push:
    branches: ['research/vm-native-20261019-hdr-s31']
  workflow_dispatch:
    inputs:
      s29_artifact_id:
        description: 'Fresh upstream synthetic artifact id; run upstream again after expiry'
        required: true
        default: '12178164564'
      s29_sha256:
        description: 'Exact upstream artifact ZIP SHA-256'
        required: true
        default: '1183b4878cbdf6c8c5aa7c2dac6f4332c2575f959398bd28299fcc87d4f8c81c'
jobs:
  preserve-sdr-rgb-iso:
    runs-on: xcode-27
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    env:
      OPENBLAS_NUM_THREADS: '1'
      S29_ARTIFACT_ID: ${{ github.event.inputs.s29_artifact_id || '12178164564' }}
      S29_ARCHIVE_SHA256: ${{ github.event.inputs.s29_sha256 || '1183b4878cbdf6c8c5aa7c2dac6f4332c2575f959398bd28299fcc87d4f8c81c' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare bounded synthetic transport
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/hdr-s31"; mkdir -m 700 "$W"
          echo "W=$W" >> "$GITHUB_ENV"
          mkdir "$W/out"
          sw_vers > "$W/out/host.txt"
          [[ "$S29_ARTIFACT_ID" =~ ^[0-9]+$ ]]
          [[ "$S29_ARCHIVE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          HDR_UPSTREAM_BYTES=$(gh api repos/21Z121Z1/Photographic_Style_Research/actions/artifacts/${S29_ARTIFACT_ID} --jq .size_in_bytes)
          [[ "$HDR_UPSTREAM_BYTES" =~ ^[0-9]+$ ]] && (( HDR_UPSTREAM_BYTES < 40000000 ))
          gh api repos/21Z121Z1/Photographic_Style_Research/actions/artifacts/${S29_ARTIFACT_ID}/zip > "$W/S29.zip"
          echo "$S29_ARCHIVE_SHA256  $W/S29.zip" | shasum -a 256 -c -
      - name: Explicit 8 10 12-bit RGB ISO maps and original SDR oracle
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'numpy==2.3.4' 'pillow-heif==1.3.0'
          python3 research/hdr-native/run_hdr_s31.py > "$W/out/driver.log" 2>&1
      - name: Seal public synthetic-only evidence
        if: always()
        run: |
          python3 - <<'PY'
          import os,pathlib,json,hashlib,subprocess
          root=pathlib.Path(os.environ['W'])/'out';rows=[]
          for p in sorted(root.rglob('*')):
              if p.is_file() and p.name!='manifest.json':
                  assert p.suffix in {'.json','.log','.txt','.f32','.heic','.xml','.npy'}
                  with p.open('rb') as f:d=hashlib.file_digest(f,'sha256').hexdigest()
                  rows.append({'path':str(p.relative_to(root)),'size':p.stat().st_size,'sha256':d})
          assert sum(x['size'] for x in rows)<100_000_000
          (root/'manifest.json').write_text(json.dumps({'run_id':os.environ['GITHUB_RUN_ID'],'commit':os.environ['GITHUB_SHA'],'os_build':subprocess.check_output(['sw_vers','-buildVersion'],text=True).strip(),'image_version':os.environ.get('ImageVersion'),'synthetic_only':True,'photos_used':False,'whole_Apple_binary_uploaded':False,'files':rows},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hdr-s31-synthetic-evidence
          path: ${{ env.W }}/out/
          retention-days: 1
      - name: Remove own runner temporary data
        if: always()
        run: test -n "${W:-}" && rm -rf -- "$W"
