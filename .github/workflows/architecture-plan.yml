name: architecture plan scoped evidence
on:
  push:
    branches: ['research/agent-architecture-plan-20261023']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-plan-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install numpy==2.2.4 Pillow==11.1.0
      - name: Reproduce bounded claims and expected refusals
        run: python research/agent-architecture-plan-20261023/tools/check_plan.py --output artifacts/architecture-plan-ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: architecture-plan-${{ github.sha }}
          path: artifacts/architecture-plan-ci/
          retention-days: 1
          if-no-files-found: error
