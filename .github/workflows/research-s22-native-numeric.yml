name: research-s22-native-numeric
on:
  push:
    branches: ['research/gpt-styles-20261019']
  workflow_dispatch:
jobs:
  native-synthetic:
    runs-on: xcode-27
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify original runner environment
        shell: bash
        run: |
          set -euo pipefail
          test "$(sw_vers -buildVersion)" = 26A434
          mkdir -p s22
          sw_vers | tee s22/host.txt
          xcodebuild -version | tee s22/xcode.txt
      - name: Compile same-function-constants Apple PSO and synthetic half pow/samplers
        shell: bash
        run: |
          set -euo pipefail
          clang -O2 -fobjc-arc research/semantic-styles/semantic_numeric_s22.m \
            -framework Foundation -framework Metal -framework CommonCrypto \
            -o "$RUNNER_TEMP/semantic-numeric-s22" 2>&1 | tee s22/build.log
          "$RUNNER_TEMP/semantic-numeric-s22" s22 2>&1 | tee s22/probe.log
      - name: Enforce native numerical and public-data acceptance gates
        shell: bash
        run: |
          set -euo pipefail
          python3 research/semantic-styles/validate.py s22/s22.json | tee s22/validate.log
      - name: Public text-only manifest
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path("s22")
          root.mkdir(exist_ok=True)
          assert all(p.is_file() and p.suffix in {".txt",".json",".log"} for p in root.iterdir())
          rows=[]
          for p in sorted(root.iterdir()):
              with p.open("rb") as f:
                  sha=hashlib.file_digest(f,"sha256").hexdigest()
              rows.append({"path":p.name,"bytes":p.stat().st_size,"sha256":sha})
          (root/"manifest.json").write_text(json.dumps({
              "run_id":os.environ["GITHUB_RUN_ID"],"head_sha":os.environ["GITHUB_SHA"],
              "privacy":"synthetic only; no input photos", "photos_used":False,
              "original_pso_mode_overridden":False, "files":rows
          },indent=2)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semantic-s22-public-synthetic-text
          path: s22/
          retention-days: 1
