name: Texture real-fixture generalization
on:
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        options: [inventory, generate]
        default: inventory
permissions:
  contents: write
concurrency:
  group: texture-fixture-${{ github.ref }}
  cancel-in-progress: false
jobs:
  fixtures:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            research/texture-producer-20261020
            research/texture-generalization-20261020
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: 21Z121Z1/XDRemux
          ref: 18340989590d451f5676924feb03c70baa503e1a
          path: xdremux-fixtures
          sparse-checkout: fixtures
          persist-credentials: false
      - name: Run exact-source native fixture matrix
        env:
          MATRIX_PHASE: ${{ inputs.phase }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 research/texture-generalization-20261020/matrix.py xdremux-fixtures/fixtures "$RUNNER_TEMP/texture-fixture-evidence" --phase "$MATRIX_PHASE"
      - name: Preserve fresh results and failure evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 research/texture-generalization-20261020/publish.py "$RUNNER_TEMP/texture-fixture-evidence"
