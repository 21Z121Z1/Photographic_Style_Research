name: semantic-styles-20261018
on:
  push:
    branches: ['research/vm-native-20261018']
    paths: ['research/semantic-styles/**', '.github/workflows/semantic-styles-20261018.yml']
  workflow_dispatch:
jobs:
  public-preflight:
    runs-on: xcode-27
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Photograph-free semantic runtime preflight
        run: python3 research/semantic-styles/run_semantic_s1.py
      - name: Seal text evidence
        if: always()
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib,os
          root=pathlib.Path('out')
          rows=[{'path':str(p.relative_to(root)),'size':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in sorted(root.rglob('*')) if p.is_file()]
          (root/'manifest.json').write_text(json.dumps({'run_id':os.environ['GITHUB_RUN_ID'],'commit':os.environ['GITHUB_SHA'],'files':rows},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semantic-s1-public-text
          path: out/
          retention-days: 1
