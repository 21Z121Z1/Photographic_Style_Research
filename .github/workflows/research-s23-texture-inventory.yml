name: research-s23-texture-inventory
on:
  push:
    branches: ['research/gpt-styles-20261019']
  workflow_dispatch:
jobs:
  texture-inventory:
    runs-on: xcode-27
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Confirm original native runner build
        shell: bash
        run: |
          set -euo pipefail
          test "$(sw_vers -buildVersion)" = 26A434
          mkdir -p b23
          sw_vers > b23/host.txt
      - name: Verify source-derived static inventory and generate synthetic charts
        shell: bash
        run: |
          set -euo pipefail
          python3 research/texture-styles/validate.py --out b23 | tee b23/validation.log
          for f in b23/*-synthetic.ppm; do
            sips -s format png "$f" --out "${f%.ppm}.png" >/dev/null
            rm "$f"
          done
          test "$(find b23 -name '*-synthetic.png' | wc -l | tr -d ' ')" = 3
      - name: Fail closed on public artifact contents and write manifest
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path("b23");root.mkdir(exist_ok=True)
          allow={".json",".log",".txt",".png"}
          files=sorted(x for x in root.iterdir() if x.is_file())
          assert all(p.suffix in allow for p in files), "Unexpected artifact file type"
          assert all("synthetic" in p.name for p in files if p.suffix==".png")
          # No user photographs or person masks are read by this workflow.
          rows=[]
          for p in files:
              with p.open("rb") as f: digest=hashlib.file_digest(f,"sha256").hexdigest()
              rows.append({"path":p.name,"size":p.stat().st_size,"sha256":digest})
          (root/"manifest.json").write_text(json.dumps({"run_id":os.environ["GITHUB_RUN_ID"],
              "head_sha":os.environ["GITHUB_SHA"],"photos_used":False,
              "simulation_only":True,"files":rows},indent=2)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: texture-s23-synthetic-only
          path: b23/
          retention-days: 1
