name: hdr-native-s35
on:
  push:
    branches: ['research/vm-native-20261019-hdr-s35']
  workflow_dispatch:
    inputs:
      s34_artifact_id:
        required: true
        default: '12183626142'
      s34_sha256:
        required: true
        default: '44d5c139665cf9e13cbb851e6a8df6f08d1ff55e69def8ff941cd1e30019c88a'
jobs:
  original-host-guided:
    runs-on: xcode-27
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    env:
      OPENBLAS_NUM_THREADS: '1'
      S34_ARTIFACT_ID: ${{ github.event.inputs.s34_artifact_id || '12183626142' }}
      S34_ARCHIVE_SHA256: ${{ github.event.inputs.s34_sha256 || '44d5c139665cf9e13cbb851e6a8df6f08d1ff55e69def8ff941cd1e30019c88a' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare immutable S34 control input
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/hdr-s35"; mkdir -m 700 "$W"; mkdir "$W/out"
          echo "W=$W" >> "$GITHUB_ENV"
          test "$(sw_vers -buildVersion)" = 26A434
          sw_vers > "$W/out/host.txt"
          gh api "repos/21Z121Z1/Photographic_Style_Research/actions/artifacts/$S34_ARTIFACT_ID/zip" > "$W/S34.zip"
      - name: Original prepare and mandatory guided execution
        run: |
          set -euo pipefail
          ulimit -c 0
          python3 -m pip install --quiet 'numpy==2.3.4'
          python3 research/hdr-native/run_hdr_s35.py > "$W/out/driver.log" 2>&1
      - name: Seal controlled synthetic-only evidence
        if: always()
        run: |
          python3 - <<'PY'
          import os,pathlib,json,hashlib,subprocess
          root=pathlib.Path(os.environ['W'])/'out'; rows=[]
          for p in sorted(root.rglob('*')):
              if p.is_file() and p.name!='manifest.json':
                  assert p.suffix in {'.json','.log','.txt','.f16','.bin'}
                  with p.open('rb') as f:d=hashlib.file_digest(f,'sha256').hexdigest()
                  rows.append({'path':str(p.relative_to(root)),'size':p.stat().st_size,'sha256':d})
          assert sum(x['size'] for x in rows)<60_000_000
          (root/'manifest.json').write_text(json.dumps({'run_id':os.environ['GITHUB_RUN_ID'],'commit':os.environ['GITHUB_SHA'],'os_build':subprocess.check_output(['sw_vers','-buildVersion'],text=True).strip(),'image_version':os.environ.get('ImageVersion'),'synthetic_only':True,'photos_used':False,'whole_Apple_binary_uploaded':False,'files':rows},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hdr-s35-synthetic-evidence
          path: ${{ env.W }}/out/
          retention-days: 1
      - name: Remove own runner temporary data
        if: always()
        run: test -n "${W:-}" && rm -rf -- "$W"
