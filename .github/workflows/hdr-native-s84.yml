name: hdr-native-s84
on:
  push:
    branches: ['research/vm-native-20261020-hdr-s84']
  workflow_dispatch:
jobs:
  full-photo-carrier-prototype:
    runs-on: xcode-27
    timeout-minutes: 55
    permissions:
      contents: read
    env:
      OPENBLAS_NUM_THREADS: '1'
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare bounded private workspace
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/hdr-s84"
          mkdir -m 700 "$W"
          mkdir "$W/out" "$W/private" "$W/encrypted"
          mkdir -m 700 "$W/gnupg"
          echo "W=$W" >> "$GITHUB_ENV"
          echo "GNUPGHOME=$W/gnupg" >> "$GITHUB_ENV"
          export GNUPGHOME="$W/gnupg"
          test "$(sw_vers -buildVersion)" = 26A434
          sw_vers > "$W/out/host.txt"
          command -v gpg >/dev/null || brew install gnupg
          gpg --batch --import research/semantic-styles/archive-public.asc > "$W/out/key-import.log" 2>&1
          python3 -m pip install --quiet 'numpy==2.3.4' 'pillow-heif==1.3.0' 'opencolorio==2.6.0' pillow > "$W/out/dependencies.log" 2>&1
      - name: New carrier on existing repository photograph
        run: |
          set -euo pipefail
          ulimit -c 0
          python3 research/hdr-native/run_hdr_s84.py > "$W/out/driver.log" 2>&1
      - name: Seal aggregate text evidence only
        if: always()
        run: |
          python3 - <<'PY'
          import pathlib,os,json,hashlib,subprocess
          p=pathlib.Path(os.environ['W'])/'out';rows=[]
          for f in sorted(p.iterdir()):
              if f.is_file() and f.name!='manifest.json':
                  assert f.suffix in {'.json','.log','.txt'}
                  with f.open('rb') as stream:h=hashlib.file_digest(stream,'sha256').hexdigest()
                  rows.append({'path':f.name,'size':f.stat().st_size,'sha256':h})
          assert sum(x['size'] for x in rows)<160000
          (p/'manifest.json').write_text(json.dumps({'run_id':os.environ['GITHUB_RUN_ID'],'commit':os.environ['GITHUB_SHA'],'os_build':subprocess.check_output(['sw_vers','-buildVersion'],text=True).strip(),'image_version':os.environ.get('ImageVersion'),'public_scope':'Aggregate text only, all photo previews encrypted; no new source photograph upload','source_data':'Existing public repository sample only; no S82 data or secret/release','files':rows},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hdr-s84-aggregate
          path: ${{ env.W }}/out/
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hdr-s84-encrypted-contact
          path: ${{ env.W }}/encrypted/previews.tar.gz.gpg
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 1
      - name: Remove only this run's private scratch files
        if: always()
        run: |
          test -n "${W:-}"
          gpgconf --homedir "$W/gnupg" --kill gpg-agent || true
          rm -rf -- "$W"
