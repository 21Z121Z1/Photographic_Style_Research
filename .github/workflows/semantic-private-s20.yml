name: semantic-private-s20
on:
  push:
    branches: ['research/vm-native-20261019-private-s20']
  workflow_dispatch:
jobs:
  native-private:
    runs-on: xcode-27
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      HOMEBREW_NO_AUTO_UPDATE: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare encrypted transport
        run: |
          set -euo pipefail
          command -v gpg >/dev/null || brew install gnupg
          W="$RUNNER_TEMP/semantic-s20"; mkdir -m 700 "$W"
          echo "W=$W" >> "$GITHUB_ENV"
          export GNUPGHOME="$W/gnupg"; mkdir -m 700 "$GNUPGHOME"
          python3 -m pip install --quiet numpy pillow pillow-heif opencolorio > "$W/dependencies.log" 2>&1
      - name: Decrypt only the authorized input inside runner temporary storage
        env:
          S20_INPUT_KEY: ${{ secrets.SEMANTIC_S20_INPUT_KEY }}
        run: |
          set -euo pipefail
          gh api repos/21Z121Z1/Photographic_Style_Research/releases/assets/654897893 -H 'Accept: application/octet-stream' > "$W/input.gpg"
          python3 - <<'PY'
          import os,pathlib,hashlib,subprocess
          w=pathlib.Path(os.environ['W']);cipher=w/'input.gpg'
          assert hashlib.sha256(cipher.read_bytes()).hexdigest()=='8cbf5b53bbd959f33e7f50fe60a65c2eafabdac9bc31ff5feb0ae0e123599771'
          key=w/'input-key';key.write_text(os.environ['S20_INPUT_KEY']);key.chmod(0o600)
          with (w/'decrypt.log').open('w') as log:
              subprocess.run(['gpg','--batch','--pinentry-mode','loopback','--passphrase-file',str(key),'--output',str(w/'IMG_2810.HEIC'),'--decrypt',str(cipher)],stdout=log,stderr=subprocess.STDOUT,check=True)
          key.unlink()
          PY
      - name: Controlled native semantic tests
        env:
          S5_ARCHIVE_SESSION: ${{ secrets.SEMANTIC_S20_S5_SESSION }}
          S17_ARCHIVE_SESSION: ${{ secrets.SEMANTIC_S20_S17_SESSION }}
        run: |
          set -euo pipefail
          mkdir -p "$W/out"
          python3 research/semantic-styles/run_semantic_s20.py > "$W/driver.log" 2>&1
      - name: Conditional supplied-curve interval inverse
        if: always()
        run: |
          mkdir -p "$W/out/curve"
          python3 -m pip install --quiet unicorn==2.1.4 >> "$W/dependencies.log" 2>&1
          python3 research/semantic-styles/test_semantic_curve_inverse_s20.py "$W/out/curve" > "$W/out/curve-driver.log" 2>&1
      - name: Encrypt all private outputs
        if: always()
        run: |
          set -euo pipefail
          test -n "${W:-}"
          export GNUPGHOME="$W/gnupg"
          mkdir -p encrypted "$W/out"
          cp "$W/decrypt.log" "$W/dependencies.log" "$W/out/" 2>/dev/null || true
          cp "$W/driver.log" "$W/out/" 2>/dev/null || true
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ['W'])/'out'
          rows=[]
          for p in sorted(root.rglob('*')):
              if p.is_file() and p.name!='manifest.json':
                  h=hashlib.sha256()
                  with p.open('rb') as f:
                      for b in iter(lambda:f.read(1048576),b''):h.update(b)
                  rows.append({'path':str(p.relative_to(root)),'size':p.stat().st_size,'sha256':h.hexdigest()})
          (root/'manifest.json').write_text(json.dumps({'run_id':os.environ['GITHUB_RUN_ID'],'commit':os.environ['GITHUB_SHA'],'os_build':'26A434','files':rows},indent=2)+'\n')
          PY
          gpg --batch --import research/semantic-styles/archive-public.asc > "$W/key-import.log" 2>&1
          tar -C "$W" -czf - out | gpg --batch --trust-model always --recipient 28E62F64A29764C2F2AEBF5D5B6B1C101E5F5ABA --encrypt --output encrypted/semantic-s20.tar.gz.gpg
          shasum -a 256 encrypted/semantic-s20.tar.gz.gpg > encrypted/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semantic-s20-encrypted
          path: encrypted/
          retention-days: 1
      - name: Remove runner plaintext
        if: always()
        run: |
          test -n "${W:-}" && rm -rf -- "$W"
